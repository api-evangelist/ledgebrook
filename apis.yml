aid: ledgebrook
name: Ledgebrook
description: 'Ledgebrook is a technology-enabled excess and surplus (E&S) lines managing
  general agent (MGA) and reinsurance platform headquartered in Massachusetts and founded
  by Gage Caligaris. It underwrites specialty commercial casualty risk — general liability,
  professional liability, and cyber — exclusively through wholesale brokers, competing
  on quote speed rather than direct-to-consumer distribution. Its stack pairs a proprietary
  underwriting workbench with machine-learning models applied across submission intake,
  triage, data architecture, and pricing, backed by an engineering, data-science and
  product organization of 70+ people, with policy administration running on Socotra.
  Ledgebrook Re extends the business into delegated-authority reinsurance with London
  and Dubai operations. The company closed an oversubscribed Series C funding round in
  June 2025 and has appeared on the CB Insights 50 Most Innovative Insurtech Startups
  list. As of this profiling pass Ledgebrook publishes no public developer portal, API
  documentation, or machine-readable API contract — its broker quoting platform is a
  private, credentialed surface.'
